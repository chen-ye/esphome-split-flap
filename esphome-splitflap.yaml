esphome:
  name: esphome-splitflap1
  friendly_name: ESPHome Split Flap 1

esp32:
  variant: ESP32C3
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_FREERTOS_HZ: "1000"

# Enable logging
logger:
  baud_rate: 115200 # Disable logging with baud_rate: 0. This may improve performance/accuracy

# Enable Home Assistant API
api:
  encryption:
    key: !secret home_assistant_key
  services:
    - service: write_paginated
      variables:
        value: string
        page_time: float
      then:
        - split_flap.write_paginated:
            id: split_flap_display
            value: !lambda 'return value;'
            page_time: !lambda 'return (uint32_t)(page_time * 1000.0f);'

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  power_save_mode: none
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "esphome-splitflap"
    # password: !secret iot_captive_password

captive_portal:

external_components:
  # - source:
  #     type: git
  #     url: https://github.com/chen-ye/esphome-split-flap
  #     ref: main
  #   components: [ split_flap ]
  - source:
      type: local
      path: components
    components: [ split_flap ]

i2c:
  sda: GPIO8
  scl: GPIO9
  frequency: 400khz


button:
  - platform: template
    name: "Home Split Flap"
    on_press:
      - split_flap.home:
          id: split_flap_display

  - platform: template
    name: "Step Character Test"
    on_press:
      - split_flap.step_9_test:
          id: split_flap_display

  - platform: template
    name: "Test Paginated Write"
    on_press:
      - split_flap.write_paginated:
          id: split_flap_display
          value: |
            WELCOME TO THE SPLIT FLAP DISPLAY
            PAGINATED AUTOMATICALLY

number:
  # =========================================================================
  # Calibration Offset Polarity Cheatsheet:
  # - Positive Offset (+N): Software thinks physical drum is ahead -> takes FEWER steps.
  #   Flap stops physically HIGHER / EARLIER (counter-clockwise) in window.
  # - Negative Offset (-N): Software thinks physical drum is behind -> takes MORE steps.
  #   Flap stops physically LOWER / LATER (clockwise) in window.
  #
  # Tuning Rules:
  # - Flap too low (needs to go UP/earlier): Increase offset (make it more positive).
  # - Flap too high (needs to go DOWN/later): Decrease offset (make it more negative).
  # =========================================================================
  - platform: split_flap
    type: page_time
    split_flap_id: split_flap_display
    name: "Page Advance Time"
    initial_value: 3.0s

  - platform: split_flap
    type: module_offset
    split_flap_id: split_flap_display
    module_index: 0
    name: "Module 0 Offset"
    initial_value: 0

  - platform: split_flap
    type: module_offset
    split_flap_id: split_flap_display
    module_index: 1
    name: "Module 1 Offset"
    initial_value: 0

  - platform: split_flap
    type: module_offset
    split_flap_id: split_flap_display
    module_index: 2
    name: "Module 2 Offset"
    initial_value: 0

  - platform: split_flap
    type: module_offset
    split_flap_id: split_flap_display
    module_index: 3
    name: "Module 3 Offset"
    initial_value: -24

  - platform: split_flap
    type: module_offset
    split_flap_id: split_flap_display
    module_index: 4
    name: "Module 4 Offset"
    initial_value: 0

  - platform: split_flap
    type: module_offset
    split_flap_id: split_flap_display
    module_index: 5
    name: "Module 5 Offset"
    initial_value: 34

  - platform: split_flap
    type: module_offset
    split_flap_id: split_flap_display
    module_index: 6
    name: "Module 6 Offset"
    initial_value: 0

  - platform: split_flap
    type: module_offset
    split_flap_id: split_flap_display
    module_index: 7
    name: "Module 7 Offset"
    initial_value: -15

text:
  - platform: split_flap
    name: "Display Text"
    id: split_flap_display
    mode: TEXT
    steps_per_rot: 2048
    magnet_position: 615
    display_offset: 0
    max_vel: 15.0
    home_on_startup: true
    startup_string: |
      HELLO
      ALEX

    modules:
      - address: 0x20
      - address: 0x21
      - address: 0x22
      - address: 0x23
      - address: 0x24
      - address: 0x25
      - address: 0x26
      - address: 0x27
