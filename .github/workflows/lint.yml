name: Lint

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Ruff Check
        uses: astral-sh/ruff-action@v3
        with:
          args: 'check .'

      - name: Run Ruff Format Check
        uses: astral-sh/ruff-action@v3
        with:
          args: 'format --check .'

  lint-cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run clang-format
        uses: Premsinghs/clang-format-lint-action@v1
        with:
          source: 'components'
          extensions: 'h,cpp'
          clangFormatVersion: 18
